name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: 单元测试
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: 安装依赖
        run: pip install -r requirements-dev.txt

      - name: 运行测试
        run: pytest tests/ -v
        # 测试用 mock，不需要真实密钥；conftest.py 会注入占位值

  docker:
    name: 镜像构建验证
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 构建镜像
        run: docker build -t allen-agent:ci .

      - name: 冒烟测试（校验 $PORT 生效且服务能起来）
        run: |
          docker run -d --name smoke -e PORT=9000 -p 9000:9000 \
            -e DEEPSEEK_API_KEY=sk-smoke-test \
            -e DEEPSEEK_BASE_URL=https://api.deepseek.com/v1 \
            -e DEEPSEEK_MODEL=deepseek-v4-flash \
            allen-agent:ci
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:9000/health && break
            sleep 1
          done
          echo
          curl -sf http://127.0.0.1:9000/health | grep -q '"ok"' || {
            echo "健康检查失败，容器日志："; docker logs smoke; exit 1;
          }
          curl -sf http://127.0.0.1:9000/myapp | grep -q '张三丰' || {
            echo "/myapp 校验失败"; docker logs smoke; exit 1;
          }
          echo "✅ 容器冒烟测试通过（监听 \$PORT=9000）"
          docker rm -f smoke
